name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Dolphin
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Dolphin Qt
        shell: pwsh
        run: |
          cmake --build build --config Release --target DolphinQt --parallel

      - name: Find Dolphin EXE
        shell: pwsh
        run: |
          Write-Host "Searching for Dolphin.exe..."

          $exe = Get-ChildItem -Path . -Recurse -File -Include Dolphin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "\\Externals\\" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Dolphin.exe not found. Showing all EXE files:"
            Get-ChildItem -Path . -Recurse -File -Include *.exe -ErrorAction SilentlyContinue |
              Select-Object FullName

            Write-Error "No Dolphin.exe found. The DolphinQt target may not have built."
            exit 1
          }

          Write-Host "Found Dolphin.exe:"
          Write-Host $exe.FullName

          "DOLPHIN_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOLPHIN_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect build files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item "$env:DOLPHIN_EXE" artifact\ -Force

          Get-ChildItem -Path "$env:DOLPHIN_DIR" -File -Include *.dll,*.pdb,*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifact\ -Force
          }

          if (Test-Path "Data") {
            Copy-Item "Data" artifact\Data -Recurse -Force
          }

          Write-Host "Artifact contents:"
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Upload Dolphin Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Windows
          path: artifact
