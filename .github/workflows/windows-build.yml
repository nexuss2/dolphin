name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Dolphin Qt
        run: |
          cmake --build build --config Release --target dolphin-emu --parallel

      - name: Find output files
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.pdb | Select-Object FullName
          Get-ChildItem -Path build -Recurse -Directory | Where-Object { $_.Name -eq "Sys" -or $_.Name -eq "Binaries" } | Select-Object FullName

      - name: Upload Dolphin Windows package
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-package
          path: |
            build/Binaries/**/*
            build/**/*.dll
            build/**/*.exe
            build/**/*.pdb
            Data/Sys/**/*
            !build/**/CompilerId*.exe
            !build/**/CMakeFiles/**/*
