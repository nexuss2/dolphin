name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: List build targets
        shell: pwsh
        run: |
          cmake --build build --config Release --target help

      - name: Build Dolphin
        shell: pwsh
        run: |
          cmake --build build --config Release --target dolphin-emu --parallel

      - name: Find Dolphin EXE
        shell: pwsh
        run: |
          Write-Host "Searching for Dolphin executable..."

          $exe = Get-ChildItem -Path build -Recurse -File -Include Dolphin.exe,dolphin-emu.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "No Dolphin EXE found. Showing EXE files:"
            Get-ChildItem -Path . -Recurse -File -Include *.exe -ErrorAction SilentlyContinue |
              Select-Object FullName

            Write-Error "No Dolphin executable found."
            exit 1
          }

          "DOLPHIN_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOLPHIN_DIR=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect build files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "$env:DOLPHIN_EXE" artifact\ -Force

          Get-ChildItem -Path "$env:DOLPHIN_DIR" -File -Include *.dll,*.pdb,*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifact\ -Force
          }

          Write-Host "Artifact contents:"
          Get-ChildItem artifact -Recurse | Select-Object FullName, Length

      - name: Upload Dolphin Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Windows
          path: artifact
