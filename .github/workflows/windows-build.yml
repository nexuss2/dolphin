name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Show available targets
        run: |
          cmake --build build --config Release --target help

      - name: Build Dolphin Qt
        run: |
          cmake --build build --config Release --target dolphin-emu --parallel

      - name: Find Dolphin files
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse | Where-Object {
            $_.Name -match "dolphin.*\.(exe|dll|pdb)$" -or $_.FullName -match "Binaries"
          } | Select-Object FullName

      - name: Upload Dolphin build
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-build
          path: |
            build/Binaries/**/*
            !build/**/CompilerId*.exe
            !build/**/CMakeFiles/**/*
