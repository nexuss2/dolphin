name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Dolphin Qt
        shell: pwsh
        run: |
          cmake --build build --config Release --target dolphin-emu --parallel

      - name: Locate and package Dolphin
        shell: pwsh
        run: |
          Write-Host "Searching for Dolphin EXE..."
          Get-ChildItem -Path build -Recurse -File | Where-Object {
            $_.Name -like "*dolphin*.exe"
          } | Select-Object FullName

          $exe = Get-ChildItem -Path build -Recurse -File | Where-Object {
            $_.Name -like "*dolphin*.exe"
          } | Select-Object -First 1

          if (-not $exe) {
            Write-Error "No Dolphin EXE found. The build did not produce dolphin-emu.exe."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item $exe.FullName package/ -Force

          Get-ChildItem -Path build -Recurse -File -Include *.dll | ForEach-Object {
            Copy-Item $_.FullName package/ -Force
          }

          Get-ChildItem -Path build -Recurse -File -Include *.pdb | ForEach-Object {
            Copy-Item $_.FullName package/ -Force
          }

          if (Test-Path Data/Sys) {
            Copy-Item Data/Sys package/Sys -Recurse -Force
          }

          Write-Host "Final package contents:"
          Get-ChildItem package -Recurse | Select-Object FullName

      - name: Upload Dolphin Windows package
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-package
          path: package/
