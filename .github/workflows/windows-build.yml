name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Dolphin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Find Dolphin EXE
        shell: pwsh
        run: |
          Write-Host "Searching for Dolphin EXE..."

          $exe = Get-ChildItem -Path build -Recurse -Include Dolphin.exe,dolphin-emu.exe -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $exe) {
            Write-Host "No Dolphin EXE found. Showing all executable outputs:"
            Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.pdb -ErrorAction SilentlyContinue | Select-Object FullName
            Write-Error "No Dolphin executable found."
            exit 1
          }

          Write-Host "Found Dolphin EXE:"
          Write-Host $exe.FullName

          "DOLPHIN_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Collect build files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          Copy-Item $env:DOLPHIN_EXE artifact\

          $exeDir = Split-Path $env:DOLPHIN_EXE -Parent

          Get-ChildItem -Path $exeDir -Include *.dll,*.pdb,*.exe -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifact\ -Force
          }

          Get-ChildItem -Path build -Recurse -Include *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName artifact\ -Force
          }

          Write-Host "Artifact contents:"
          Get-ChildItem artifact | Select-Object Name, Length

      - name: Upload Dolphin build
        uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Windows
          path: artifact
