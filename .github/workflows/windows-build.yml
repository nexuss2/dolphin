name: Build Windows Dolphin

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: |
          cmake --build build --config Release --target dolphin-emu --parallel

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Recurse -Filter *.exe | Select-Object FullName

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-exe
          path: |
            build/**/*.exe
            build/Binaries/**
